<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://raw.githubusercontent.com/alkhooryengineering/ake_material_form/c4da32d966f8d240c9040049e11066129f966ddc/AKE%20LOGO.png" type="image/png">
<title>Device Logger</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-image: url("https://raw.githubusercontent.com/alkhooryengineering/ake-landing-page/main/AKE%20Street%20View.png");
  background-size: cover;
  background-attachment: fixed;
}

.container {
  background: rgba(255,255,255,0.95);
  max-width: 950px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 48%;
  margin-top: 20px;
  padding: 12px;
  background: #004488;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.buttons {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 25px;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

.thumbnail {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">
<h2 style="text-align:center;">Device Logger</h2>

<form id="deviceForm">

<label>Person</label>
<select id="person" required>
  <option value="" disabled selected>Select</option>
  <option>Rehman</option>
  <option>Sarfraz</option>
  <option>Senthil</option>
  <option>Yaship</option>
  <option>Aruna</option>
  <option>Other</option>
</select>
<input id="person_other" placeholder="Enter name" style="display:none;">

<label>Device</label>
<select id="device_name" required>
  <option value="" disabled selected>Select</option>
  <option>Wifi-Elitech-1</option>
  <option>Wifi-Elitech-2</option>
  <option>Wifi-Elitech-3</option>
  <option>Wifi-Elitech-4</option>
  <option>Wifi-Elitech-5</option>
  <option>Wifi-Elitech-6</option>
  <option>Wifi-Elitech-7</option>
  <option>Wifi-Elitech-8</option>
  <option>Wifi-Elitech-9</option>
  <option>Other</option>
</select>

<label>Device ID (Unique)</label>
<input id="device_id" required>

<label>Serial Number (Optional)</label>
<input id="serial">

<label>Location</label>
<input id="location" required>

<label>Photo</label>
<input type="file" id="photo" accept="image/*" required>

<div class="buttons">
  <button type="button" onclick="addDevice()">Add Device</button>
  <button type="button" onclick="updateDevice()">Update Device</button>
</div>

</form>

<table>
<thead>
<tr>
  <th>Person</th>
  <th>Device</th>
  <th>Device ID</th>
  <th>Serial</th>
  <th>Location</th>
  <th>Time</th>
  <th>Photo</th>
</tr>
</thead>
<tbody id="deviceTable"></tbody>
</table>
</div>

<script>
const deviceTable = document.getElementById("deviceTable");
let devices = JSON.parse(localStorage.getItem("devices") || "[]");

const deviceIDs = {
  "Wifi-Elitech-1": "ID001",
  "Wifi-Elitech-2": "ID002",
  "Wifi-Elitech-3": "ID003",
  "Wifi-Elitech-4": "ID004",
  "Wifi-Elitech-5": "ID005",
  "Wifi-Elitech-6": "ID006",
  "Wifi-Elitech-7": "ID007",
  "Wifi-Elitech-8": "ID008",
  "Wifi-Elitech-9": "ID009"
};

document.getElementById("person").addEventListener("change", e=>{
  document.getElementById("person_other").style.display =
    e.target.value === "Other" ? "block" : "none";
});

document.getElementById("device_name").addEventListener("change", e=>{
  const idField = document.getElementById("device_id");
  if(e.target.value === "Other"){
    idField.value = "";
  } else {
    idField.value = deviceIDs[e.target.value] || "";
  }
});

function renderTable(){
  deviceTable.innerHTML = "";
  devices.forEach(d=>{
    deviceTable.innerHTML += `
      <tr>
        <td>${d.person}</td>
        <td>${d.device}</td>
        <td>${d.deviceID}</td>
        <td>${d.serial || ""}</td>
        <td>${d.location}</td>
        <td>${d.time}</td>
        <td><img src="${d.photo}" class="thumbnail"></td>
      </tr>`;
  });
}
renderTable();

function getFormData(callback){
  let person = document.getElementById("person").value;
  if(person === "Other"){
    person = document.getElementById("person_other").value;
  }

  const device = document.getElementById("device_name").value;
  const deviceID = document.getElementById("device_id").value;
  const serial = document.getElementById("serial").value;
  const location = document.getElementById("location").value;
  const photoFile = document.getElementById("photo").files[0];

  if(!deviceID){
    alert("Device ID is mandatory");
    return;
  }

  const reader = new FileReader();
  reader.onload = ()=>{
    callback({
      person,
      device,
      deviceID,
      serial,
      location,
      time: new Date().toLocaleString(),
      photo: reader.result
    });
  };
  reader.readAsDataURL(photoFile);
}

function addDevice(){
  getFormData(data=>{
    if(devices.some(d=>d.deviceID === data.deviceID)){
      alert("Device ID already exists. Use Update instead.");
      return;
    }
    devices.push(data);
    localStorage.setItem("devices", JSON.stringify(devices));
    renderTable();
    document.getElementById("deviceForm").reset();
    document.getElementById("person_other").style.display="none";
  });
}

function updateDevice(){
  getFormData(data=>{
    const index = devices.findIndex(d=>d.deviceID === data.deviceID);
    if(index === -1){
      alert("Device ID not found. Use Add Device.");
      return;
    }
    devices[index] = data;
    localStorage.setItem("devices", JSON.stringify(devices));
    renderTable();
    document.getElementById("deviceForm").reset();
    document.getElementById("person_other").style.display="none";
  });
}
</script>

</body>
</html>
