<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Device Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    form#deviceForm {
      max-width: 600px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    select, input[type="text"], input[type="file"], input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .buttons button {
      padding: 7px 14px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .buttons button:hover {
      opacity: 0.9;
    }

    button.add-btn { background-color: #4CAF50; color: white; }
    button.update-btn { background-color: #2196F3; color: white; }
    button.delete-btn { background-color: #f44336; color: white; }

    table#deviceTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table#deviceTable th, table#deviceTable td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 14px;
    }

    table#deviceTable th {
      background-color: #f2f2f2;
    }

    .selectDevice {
      display: block;
      margin: 0 auto;
      transform: scale(1.2);
    }

    #person_other {
      display: none;
    }
  </style>
</head>
<body>

<form id="deviceForm" onsubmit="return false;">

  <label>Person</label>
  <select id="person" required onchange="toggleOtherPerson()">
    <option value="" disabled selected>Select</option>
    <option>Rehman</option>
    <option>Sarfraz</option>
    <option>Senthil</option>
    <option>Yaship</option>
    <option>Aruna</option>
    <option>Other</option>
  </select>
  <input id="person_other" placeholder="Enter name">

  <label>Device</label>
  <select id="device_name" required>
    <option value="" disabled selected>Select</option>
    <option>Wifi-Elitech-1</option>
    <option>Wifi-Elitech-2</option>
    <option>Wifi-Elitech-3</option>
    <option>Wifi-Elitech-4</option>
    <option>Wifi-Elitech-5</option>
    <option>Wifi-Elitech-6</option>
    <option>Wifi-Elitech-7</option>
    <option>Wifi-Elitech-8</option>
    <option>Wifi-Elitech-9</option>
    <option>Other</option>
  </select>

  <label>Device ID (autofil)</label>
  <input id="device_id" required>

  <label>Reminder</label>
  <input id="serial">

  <label>Location</label>
  <input id="location" required>

  <label>Photo</label>
  <input type="file" id="photo" accept="image/*" required>

  <div class="buttons">
    <button type="button" class="add-btn" onclick="addDevice()">Add Device</button>
    <button type="button" class="update-btn" onclick="updateDevice()">Update Device</button>
    <button type="button" class="delete-btn" onclick="deleteSelectedDevices()">Delete ✅</button>
  </div>

  <table id="deviceTable">
    <thead>
      <tr>
        <th>Select</th>
        <th>Person</th>
        <th>Device</th>
        <th>Device ID</th>
        <th>Location</th>
        <th>Photo</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be added here -->
    </tbody>
  </table>

</form>

<script>
const predefinedPassword = "1234"; // change this to your preferred password

function toggleOtherPerson() {
  const personSelect = document.getElementById('person');
  const otherInput = document.getElementById('person_other');
  otherInput.style.display = (personSelect.value === 'Other') ? 'block' : 'none';
}

function validatePerson() {
  const personSelect = document.getElementById('person');
  const otherInput = document.getElementById('person_other');

  if (!personSelect.value) {
    alert('Please select a person.');
    return false;
  }
  if (personSelect.value === 'Other' && otherInput.value.trim() === '') {
    alert('Please enter a name for "Other".');
    return false;
  }
  return true;
}

function addDevice() {
  if (!validatePerson()) return;

  const person = document.getElementById('person').value;
  const personOther = document.getElementById('person_other').value;
  const device = document.getElementById('device_name').value;
  const deviceId = document.getElementById('device_id').value;
  const location = document.getElementById('location').value;
  const photo = document.getElementById('photo').files[0]?.name || "";

  if (!device) { alert("Please select a device."); return; }
  if (!deviceId) { alert("Please enter Device ID."); return; }
  if (!location) { alert("Please enter Location."); return; }
  if (!photo) { alert("Please select a Photo."); return; }

  const table = document.getElementById('deviceTable').getElementsByTagName('tbody')[0];
  const row = table.insertRow();
  row.innerHTML = `
    <td><input type="checkbox" class="selectDevice"></td>
    <td>${person === 'Other' ? personOther : person}</td>
    <td>${device}</td>
    <td>${deviceId}</td>
    <td>${location}</td>
    <td>${photo}</td>
  `;
}

function updateDevice() {
  alert("Update functionality not implemented yet.");
}

function deleteSelectedDevices() {
  const password = prompt("Enter password to delete selected devices:");
  if (password !== predefinedPassword) {
    alert("Incorrect password. Cannot delete devices.");
    return;
  }

  const table = document.getElementById('deviceTable').getElementsByTagName('tbody')[0];
  const checkboxes = table.querySelectorAll('.selectDevice');

  for (let i = checkboxes.length - 1; i >= 0; i--) {
    if (checkboxes[i].checked) {
      table.deleteRow(i);
    }
  }

  alert("Selected devices deleted successfully.");
}
</script>

</body>
</html>
