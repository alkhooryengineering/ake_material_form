<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Engineering Order Form</title>
  <link rel="icon" href="https://raw.githubusercontent.com/alkhooryengineering/ake_material_form/c4da32d966f8d240c9040049e11066129f966ddc/AKE%20LOGO.png" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #003366 0%, #005580 100%);
      background-image: url("https://raw.githubusercontent.com/alkhooryengineering/ake-landing-page/main/AKE%20Street%20View.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.95);
      margin: 20px auto;
      max-width: 900px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      position: relative;
      z-index: 2;
    }

    h1 {
      text-align: center;
      color: #002244;
      margin-bottom: 10px;
      font-size: 22px;
    }

    label {
      margin-top: 10px;
      font-weight: bold;
      display: block;
    }

    select, input {
      display: block;
      margin: 8px 0;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      padding: 12px;
      background-color: #004488;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #0066aa;
    }

    #deviceTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    #deviceTable th, #deviceTable td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    #deviceTable img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 5px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>AKE Device Management</h1>
    <form id="deviceForm">
      <label>Device Name:</label>
      <select id="device_name" onchange="toggleDeviceOther(this)" required>
        <option value="" disabled selected>Select Device</option>
        <option>Wifi-Elitech-1</option>
        <option>Wifi-Elitech-2</option>
        <option>Wifi-Elitech-3</option>
        <option>Wifi-Elitech-4</option>
        <option>Wifi-Elitech-5</option>
        <option>Wifi-Elitech-6</option>
        <option>Wifi-Elitech-7</option>
        <option>Wifi-Elitech-8</option>
        <option>Wifi-Elitech-9</option>
        <option>Other</option>
      </select>
      <input type="text" id="device_other" placeholder="Enter device name" style="display:none;" />

      <label>Serial Number:</label>
      <input type="text" id="serial_number" required/>

      <label>Location:</label>
      <input type="text" id="location" required/>

      <label>Person Adding Device:</label>
      <select id="person_name" onchange="togglePersonOther(this)" required>
        <option value="" disabled selected>Select Person</option>
        <option>Rehman</option>
        <option>Sarfraz</option>
        <option>Senthil</option>
        <option>Yaship</option>
        <option>Aruna</option>
        <option>Other</option>
      </select>
      <input type="text" id="person_other" placeholder="Enter name" style="display:none;" />

      <label>Photo:</label>
      <input type="file" id="photo" accept="image/*" required />

      <button type="button" onclick="submitDevice()">Add / Update Device</button>
    </form>

    <h3>Devices Table</h3>
    <table id="deviceTable">
      <thead>
        <tr>
          <th>Serial Number</th>
          <th>Device Name</th>
          <th>Location</th>
          <th>Person</th>
          <th>Timestamp</th>
          <th>Photo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
let devices = [];

function toggleDeviceOther(sel){ document.getElementById("device_other").style.display = sel.value==="Other"?"block":"none";}
function togglePersonOther(sel){ document.getElementById("person_other").style.display = sel.value==="Other"?"block":"none";}

function submitDevice(){
  const deviceSelect = document.getElementById("device_name");
  const device = deviceSelect.value==="Other"?document.getElementById("device_other").value:deviceSelect.value;
  const serial = document.getElementById("serial_number").value.trim();
  const location = document.getElementById("location").value.trim();
  const personSelect = document.getElementById("person_name");
  const person = personSelect.value==="Other"?document.getElementById("person_other").value:personSelect.value;
  const photoFile = document.getElementById("photo").files[0];

  if(!device||!serial||!location||!person||!photoFile){ alert("Fill all fields."); return;}

  const reader = new FileReader();
  reader.onload = function(e){
    const photoData = e.target.result;

    const formData = new FormData();
    formData.append("action","save");
    formData.append("serial_number",serial);
    formData.append("device_name",device);
    formData.append("location",location);
    formData.append("person_name",person);
    formData.append("photo",photoData);

    fetch('Loggers.php',{method:'POST',body:formData})
    .then(res=>res.json())
    .then(data=>{
      devices = data;
      renderTable();
      document.getElementById("deviceForm").reset();
      document.getElementById("device_other").style.display="none";
      document.getElementById("person_other").style.display="none";
    })
    .catch(err=>console.error(err));
  };
  reader.readAsDataURL(photoFile);
}

function renderTable(){
  const tbody = document.querySelector("#deviceTable tbody");
  tbody.innerHTML="";
  devices.forEach(d=>{
    const tr = document.createElement("tr");
    tr.innerHTML=`<td>${d.serial_number}</td>
                  <td>${d.device_name}</td>
                  <td>${d.location}</td>
                  <td>${d.person_name}</td>
                  <td>${d.timestamp}</td>
                  <td><img src="${d.photo}" /></td>`;
    tbody.appendChild(tr);
  });
}

// Fetch devices on load
window.onload = function(){
  const formData = new FormData();
  formData.append("action","fetch");
  fetch('Loggers.php',{method:'POST',body:formData})
    .then(res=>res.json())
    .then(data=>{ devices=data; renderTable(); })
    .catch(err=>console.error(err));
}
</script>
</body>
</html>
