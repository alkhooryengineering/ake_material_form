<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKE Loggers</title>



<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-image: url("https://raw.githubusercontent.com/alkhooryengineering/ake-landing-page/main/AKE%20Street%20View.png");
  background-size: cover;
  background-attachment: fixed;
}

.container {
  background: rgba(255,255,255,0.95);
  max-width: 950px;
  margin: 20px auto;
  padding: 40px 30px; /* increased padding to prevent touching edges */
  border-radius: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
}





/* Make all inputs and selects same width */
#deviceForm input,
#deviceForm select,
#deviceForm input[type="file"] {
  width: 100%;   /* full width of the container */
  padding: 12px;
  box-sizing: border-box; /* ensures padding is included in width */
  border-radius: 12px;   /* <-- increase for more roundness */
  border: 1px solid #ccc;
}


  




  

button {
  width: 48%;
  margin-top: 20px;
  padding: 12px;
  background: #004488;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.buttons {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 25px;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

.thumbnail {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 6px;
}

/* Device form specific */
#deviceForm select,
#deviceForm input[type="text"],
#deviceForm input[type="file"] {
  width: 100%; /* full width minus container padding */
  padding: 12px;
  box-sizing: border-box;
}


/* Delete button styling */
.delete-btn {
  padding: 6px 12px;       /* smaller padding to fit cell */
  font-size: 14px;         /* slightly smaller font */
  background-color: #d9534f; /* red color for delete */
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;     /* prevents wrapping */
}

.delete-btn:hover {
  background-color: #c9302c; /* darker red on hover */
}





  
</style>


  



  
</head>
<body>
<div class="container">
<h2 style="text-align:center;">AKE Loggers</h2>
<form id="deviceForm" onsubmit="return handleSubmit()">
  <label>Person</label>
  <select id="person" required onchange="toggleOtherPerson()">
    <option value="" disabled selected>Select</option>
    <option>Rehman</option>
    <option>Sarfraz</option>
    <option>Senthil</option>
    <option>Yaship</option>
    <option>Aruna</option>
    <option>Other</option>
  </select>
  <input id="person_other" placeholder="Enter name" style="display:none;">

  <label>Device</label>
  <select id="device_name" required>
    <option value="" disabled selected>Select</option>
    <option>Wifi-Elitech-1</option>
    <option>Wifi-Elitech-2</option>
    <option>Wifi-Elitech-3</option>
    <option>Wifi-Elitech-4</option>
    <option>Wifi-Elitech-5</option>
    <option>Wifi-Elitech-6</option>
    <option>Wifi-Elitech-7</option>
    <option>Wifi-Elitech-8</option>
    <option>Wifi-Elitech-9</option>
    <option>Other</option>
  </select>

  <label>Device ID (autofill)</label>
  <input id="device_id" required>

  <label>Reminder</label>
  <input id="serial">

  <label>Location</label>
  <input id="location" required>

  <label>Photo</label>
  <input type="file" id="photo" accept="image/*" required>

  <div class="buttons">
    <button type="submit">Add Device</button>
    <button type="button" onclick="updateDevice()">Update Device</button>
  </div>
</form>

<table>
<thead>
<tr>
  <th>Person</th>
  <th>Device</th>
  <th>Device ID</th>
  <th>Reminder</th>
  <th>Location</th>
  <th>Time</th>
  <th>Photo</th>
  <th>Delete</th>
</tr>
</thead>
<tbody id="deviceTable"></tbody>
</table>
</div>

<script>
// Google Sheet Web App URL
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxvuyiKBcwThK6xkZeiS6kM-Y0HGwE31W59_8bnHlUOvgwWMG3GLnemLw022NLE7z23/exec";

let devices = [];

const deviceIDs = {
  "Wifi-Elitech-1": "ID001",
  "Wifi-Elitech-2": "ID002",
  "Wifi-Elitech-3": "ID003",
  "Wifi-Elitech-4": "ID004",
  "Wifi-Elitech-5": "ID005",
  "Wifi-Elitech-6": "ID006",
  "Wifi-Elitech-7": "ID007",
  "Wifi-Elitech-8": "ID008",
  "Wifi-Elitech-9": "ID009"
};

// Show/hide Other person input
function toggleOtherPerson() {
  document.getElementById('person_other').style.display =
    document.getElementById('person').value === "Other" ? "block" : "none";
}

// Validate form
function validatePerson() {
  const person = document.getElementById('person').value;
  const other = document.getElementById('person_other').value;
  if (!person) { alert("Select a person"); return false; }
  if (person==="Other" && !other.trim()) { alert("Enter name for 'Other'"); return false; }
  return true;
}

// Autofill device ID
document.getElementById("device_name").addEventListener("change", e=>{
  document.getElementById("device_id").value =
    e.target.value==="Other" ? "" : deviceIDs[e.target.value] || "";
});

// Render table
const deviceTable = document.getElementById("deviceTable");
function renderTable() {
  deviceTable.innerHTML = "";
  devices.forEach(d=>{
    deviceTable.innerHTML += `
      <tr>
        <td>${d.person}</td>
        <td>${d.device}</td>
        <td>${d.deviceID}</td>
        <td>${d.serial||""}</td>
        <td>${d.location}</td>
        <td>${d.time}</td>
        <td><img src="${d.photo}" class="thumbnail"></td>
        <button onclick="deleteDevice('${d.deviceID}')">Delete</button>
      </tr>`;
  });
}

// Load devices from Google Sheet
function loadDevices() {
  fetch(SHEET_URL)
    .then(res => res.json())
    .then(data => {
      devices = data.map(d => ({
        person: d[0],
        device: d[1],
        deviceID: d[2],
        serial: d[3],
        location: d[4],
        time: d[5],
        photo: d[6]
      }));
      renderTable();
    })
    .catch(err => console.error("Failed to load devices:", err));
}

// Call on page load
document.addEventListener("DOMContentLoaded", loadDevices);

// Get form data
function getFormData(callback){
  let person = document.getElementById("person").value;
  if(person==="Other") person=document.getElementById("person_other").value;
  const device = document.getElementById("device_name").value;
  const deviceID = document.getElementById("device_id").value;
  const serial = document.getElementById("serial").value;
  const location = document.getElementById("location").value;
  const photoFile = document.getElementById("photo").files[0];
  if(!deviceID){ alert("Device ID is mandatory"); return; }
  const reader = new FileReader();
  reader.onload = ()=>{ 
    callback({ person, device, deviceID, serial, location, time:new Date().toLocaleString(), photo:reader.result }); 
  };
  reader.readAsDataURL(photoFile);
}





  function addDevice(isAdd = true){  
  getFormData(data=>{
    if(isAdd){
      const exists = devices.some(d => d.deviceID.trim().toLowerCase() === data.deviceID.trim().toLowerCase());
      if(exists){
        alert("Same Device ID Already Exist, Please Use Update Function");
        return;
      }
    }

    fetch(SHEET_URL, { method:"POST", body:JSON.stringify(data) })
      .then(res=>res.text())
      .then(msg=>{
        alert("Device saved/updated successfully!");
        const index = devices.findIndex(d=>d.deviceID===data.deviceID);
        if(index!==-1) devices[index]=data;
        else devices.push(data);
        renderTable();
        document.getElementById("deviceForm").reset();
        document.getElementById("person_other").style.display="none";
      })
      .catch(err=>{ console.error("Error:",err); alert("Failed to save device. Check console."); });
  });
}

// Update button (calls same addDevice but tells it it's an update)
function updateDevice(){
  addDevice(false);  // <-- pass false here
}




  



// Form submit
function handleSubmit() {
  if (!validatePerson()) return false;
  addDevice();
  return false;
}






function deleteDevice(deviceID) {
  if(!confirm("Are you sure you want to delete this device?")) return;

  // Remove from local array
  devices = devices.filter(d => d.deviceID !== deviceID);
  renderTable();

  // Send DELETE request to Google Sheet (or mark as deleted)
  fetch(SHEET_URL, {
    method: "POST",
    body: JSON.stringify({ action: "delete", deviceID })
  })
  .then(res => res.text())
  .then(msg => alert("Device deleted successfully!"))
  .catch(err => console.error(err));
}






</script>

</body>
</html>
